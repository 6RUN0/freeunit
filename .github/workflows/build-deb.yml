name: "Build deb packages (Debian trixie)"

# Builds binary .deb packages for the core daemon and selected language
# modules on Debian trixie, smoke-tests each installed package, then
# publishes them as GitHub Release assets.
#
#   * unit            - core daemon (njs + otel, built from pkg/contrib + rust)
#   * unit-php8.3      - PHP 8.3 module (from deb.sury.org)
#   * unit-php8.4      - PHP 8.4 module (from deb.sury.org)
#   * unit-python3.13  - Python 3.13 module (native trixie)
#
# Trigger manually (workflow_dispatch) to produce build artifacts, or push a
# version tag to additionally attach the .deb files to the matching GitHub
# Release. Tag patterns cover the upstream "X.Y.Z" scheme plus fork-specific
# build/patch/revision suffixes (e.g. 1.35.5b-1). The release job runs only
# after the smoke tests pass.

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+[brp]-?[0-9]+'

# Default to least privilege; only the release job elevates to contents: write.
permissions:
  contents: read

jobs:
  build-trixie:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd   # v5
        with:
          persist-credentials: false

      - name: Install build dependencies (incl. deb.sury.org PHP)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg lsb-release
          # deb.sury.org provides php8.3 / php8.4 on Debian trixie
          curl -fsSL https://packages.sury.org/php/apt.gpg \
            -o /usr/share/keyrings/sury-php.gpg
          echo "deb [signed-by=/usr/share/keyrings/sury-php.gpg] https://packages.sury.org/php/ $(lsb_release -sc) main" \
            > /etc/apt/sources.list.d/sury-php.list
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts fakeroot lintian \
            libxml2-utils xsltproc pkg-config git \
            libssl-dev libpcre2-dev clang llvm \
            cargo rustc \
            php8.3-dev libphp8.3-embed \
            php8.4-dev libphp8.4-embed \
            python3.13-dev

      - name: Build .deb packages
        run: |
          set -eux
          # debuild would otherwise gate the build on lintian findings
          echo 'DEBUILD_LINTIAN=no' > "$HOME/.devscripts"
          make -C pkg/deb unit unit-php83 unit-php84 unit-python313
          ls -la pkg/deb/debs/

      - name: Upload .deb as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: freeunit-trixie-debs
          path: pkg/deb/debs/*.deb
          if-no-files-found: error

  # Each module is smoke-tested on its own clean container, installed next to
  # the core only. This mirrors real usage: the PHP embed SAPI exposes an
  # unversioned libphp.so, so unit-php8.3 and unit-php8.4 cannot run in the
  # same instance — one PHP version per image.
  smoke-test:
    needs: build-trixie
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: unit-php8.3,     kind: php, type: "php",          port: "8083", expect: "OK-PHP-8.3" }
          - { module: unit-php8.4,     kind: php, type: "php",          port: "8084", expect: "OK-PHP-8.4" }
          - { module: unit-python3.13, kind: py,  type: "python 3.13",  port: "8013", expect: "OK-PY-3.13" }

    steps:
      - name: Download built .deb packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: freeunit-trixie-debs
          path: debs

      - name: "Serve a request through ${{ matrix.module }}"
        env:
          DEBIAN_FRONTEND: noninteractive
          MODULE: ${{ matrix.module }}
          APP_KIND: ${{ matrix.kind }}
          APP_TYPE: ${{ matrix.type }}
          PORT: ${{ matrix.port }}
          EXPECT: ${{ matrix.expect }}
        run: |
          set -eux
          # No init system in the container; stop maintainer scripts starting it.
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod +x /usr/sbin/policy-rc.d
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg lsb-release
          curl -fsSL https://packages.sury.org/php/apt.gpg -o /usr/share/keyrings/sury-php.gpg
          echo "deb [signed-by=/usr/share/keyrings/sury-php.gpg] https://packages.sury.org/php/ $(lsb_release -sc) main" \
            > /etc/apt/sources.list.d/sury-php.list
          apt-get update
          # core + exactly one module (single PHP version per instance).
          # The artifact holds exactly one build's debs, so a version-agnostic
          # glob installs the right pair without coupling to a literal version.
          apt-get install -y --no-install-recommends ./debs/unit_*.deb "./debs/${MODULE}_"*.deb

          /usr/sbin/unitd
          for _ in $(seq 1 30); do [ -S /var/run/control.unit.sock ] && break; sleep 0.5; done
          test -S /var/run/control.unit.sock

          mkdir -p /tmp/app
          if [ "$APP_KIND" = php ]; then
          printf '<?php echo "OK-PHP-".PHP_VERSION;\n' > /tmp/app/index.php
          app="{\"type\": \"$APP_TYPE\", \"root\": \"/tmp/app\", \"script\": \"index.php\"}"
          else
          cat > /tmp/app/wsgi.py <<'PY'
          import sys


          def application(environ, start_response):
              start_response("200 OK", [("Content-Type", "text/plain")])
              body = "OK-PY-%d.%d" % (sys.version_info[0], sys.version_info[1])
              return [body.encode()]
          PY
          app="{\"type\": \"$APP_TYPE\", \"path\": \"/tmp/app\", \"module\": \"wsgi\"}"
          fi
          chmod -R a+rX /tmp/app

          curl -fsS -X PUT --unix-socket /var/run/control.unit.sock \
            --data-binary "{\"listeners\": {\"*:$PORT\": {\"pass\": \"applications/a\"}}, \"applications\": {\"a\": $app}}" \
            http://localhost/config

          out=
          for _ in $(seq 1 20); do
            if out=$(curl -fsS "http://localhost:$PORT/" 2>/dev/null) && printf '%s' "$out" | grep -q "$EXPECT"; then
              echo "PASS $MODULE -> $out"
              exit 0
            fi
            sleep 1
          done
          echo "FAIL $MODULE (expected '$EXPECT'), last response: '${out:-<none>}'"
          cat /var/log/unit.log || true
          exit 1

  release:
    needs: [build-trixie, smoke-test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to upload assets to the release
    steps:
      - name: Download built .deb packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: freeunit-trixie-debs
          path: debs

      - name: Attach .deb to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2
        with:
          files: debs/*.deb
